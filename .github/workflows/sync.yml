name: Sync bookmarks from WebDAV

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: python -m pip install cryptography

      - name: Fetch meta.json from WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          mkdir -p data
          curl -sS -u "$WEBDAV_USER:$WEBDAV_PASS" "$WEBDAV_URL/meta.json" -o data/meta.json
          curl -sS -u "$WEBDAV_USER:$WEBDAV_PASS" "$WEBDAV_URL/categories.json" -o data/categories.json
          ls -la data/
          head -c 200 data/meta.json; echo

      - name: Merge and encrypt
        env:
          BOOKMARK_PASSWORD: ${{ secrets.BOOKMARK_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, base64
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes

          with open('data/meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          with open('data/categories.json', encoding='utf-8') as f:
              cats = json.load(f)

          bookmarks = meta.get('bookmarks', []) if isinstance(meta, dict) else meta
          data = {
              'bookmarks': bookmarks,
              'categories': cats,
              'updatedAt': datetime.now(timezone.utc).isoformat(),
          }
          plaintext = json.dumps(data, ensure_ascii=False).encode('utf-8')

          pwd = os.environ.get('BOOKMARK_PASSWORD', '')
          if not pwd:
              raise SystemExit('BOOKMARK_PASSWORD secret is not set')

          salt = b'ouyang-bookmarks-fixed-salt-v1'
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(pwd.encode('utf-8'))
          iv = os.urandom(12)
          ct = AESGCM(key).encrypt(iv, plaintext, None)

          out = {
              'v': 1,
              'salt': base64.b64encode(salt).decode(),
              'iv': base64.b64encode(iv).decode(),
              'ct': base64.b64encode(ct).decode(),
          }
          with open('data/encrypted.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print('Encrypted OK, bookmarks:', len(bookmarks))
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/encrypted.json
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: sync bookmarks [skip ci]'
            git push
          fi
