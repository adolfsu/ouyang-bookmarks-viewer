name: Sync bookmarks from WebDAV

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography
        run: python -m pip install cryptography

      - name: Fetch data from WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
        run: |
          mkdir -p data
          echo "URL base: $WEBDAV_URL"
          echo "Downloading meta.json..."
          curl -fL --retry 2 --retry-delay 2 -sS \
            -u "$WEBDAV_USER:$WEBDAV_PASS" \
            -w "HTTP_CODE:%{http_code} SIZE:%{size_download}\n" \
            "$WEBDAV_URL/HamHomeSync/bookmarks/meta.json" -o data/meta.json
          echo "Downloading categories.json..."
          curl -fL --retry 2 --retry-delay 2 -sS \
            -u "$WEBDAV_USER:$WEBDAV_PASS" \
            -w "HTTP_CODE:%{http_code} SIZE:%{size_download}\n" \
            "$WEBDAV_URL/HamHomeSync/categories.json" -o data/categories.json
          echo "--- meta.json head ---"
          head -c 300 data/meta.json; echo
          echo "--- categories.json head ---"
          head -c 300 data/categories.json; echo
          ls -la data/

      - name: Merge and encrypt
        env:
          BOOKMARK_PASSWORD: ${{ secrets.BOOKMARK_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, base64
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes

          for p in ['data/meta.json', 'data/categories.json']:
              if not os.path.exists(p) or os.path.getsize(p) == 0:
                  raise SystemExit(f'ERROR: {p} missing or empty')
              with open(p, encoding='utf-8') as f:
                  head = f.read(200)
                  if not head.strip().startswith('{') and not head.strip().startswith('['):
                      raise SystemExit(f'ERROR: {p} does not look like JSON: {head[:100]}')

          with open('data/meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          with open('data/categories.json', encoding='utf-8') as f:
              cats = json.load(f)

          bookmarks = meta.get('bookmarks', []) if isinstance(meta, dict) else meta
          data = {
              'bookmarks': bookmarks,
              'categories': cats,
              'updatedAt': datetime.now(timezone.utc).isoformat(),
          }
          plaintext = json.dumps(data, ensure_ascii=False).encode('utf-8')

          pwd = os.environ.get('BOOKMARK_PASSWORD', '')
          if not pwd:
              raise SystemExit('ERROR: BOOKMARK_PASSWORD secret is not set')

          salt = b'ouyang-bookmarks-fixed-salt-v1'
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(pwd.encode('utf-8'))
          iv = os.urandom(12)
          ct = AESGCM(key).encrypt(iv, plaintext, None)

          out = {
              'v': 1,
              'salt': base64.b64encode(salt).decode(),
              'iv': base64.b64encode(iv).decode(),
              'ct': base64.b64encode(ct).decode(),
          }
          with open('data/encrypted.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print(f'Encrypted OK, bookmarks: {len(bookmarks)}, encrypted size: {os.path.getsize("data/encrypted.json")}')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/encrypted.json
          if git diff --staged --quiet; then
            echo 'No changes'
          else
            git commit -m 'chore: sync bookmarks [skip ci]'
            git push
          fi
