<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#050A12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>欧阳的收藏夹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050A12'/%3E%3Cpath d='M18 22h12l4 5h12a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V25a3 3 0 0 1 3-3z' fill='%234FD1FF'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #050A12;
    --bg-2: #08111F;
    --surface: #0B1524;
    --surface-2: #101D31;
    --border: rgba(90,170,255,.16);
    --border-2: rgba(90,170,255,.34);
    --text: #D6E4F7;
    --text-2: #8296B2;
    --text-3: #4E6280;
    --accent: #4FD1FF;
    --accent-2: #1E5BFF;
    --accent-soft: rgba(79,209,255,.10);
    --danger: #FF6B81;
    --radius: 12px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  html.lock { overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(79,209,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,209,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    opacity: .55;
  }
  body::after {
    content: ''; position: fixed; left: 0; right: 0; top: 0; height: 420px; z-index: 0; pointer-events: none;
    background: radial-gradient(680px 320px at 50% -80px, rgba(30,91,255,.20), rgba(5,10,18,0) 70%);
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  .gate { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card {
    width: 100%; max-width: 358px; text-align: center; padding: 28px 24px 24px;
    background: linear-gradient(180deg, rgba(16,29,49,.94), rgba(11,21,36,.97));
    border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .gate-mark { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--accent-soft); position: relative; }
  .gate-mark::after { content: ''; position: absolute; inset: 12px; border-radius: 6px; border: 1.5px solid var(--accent); opacity: .9; }
  .gate h1 { margin: 0 0 6px; font-size: 19px; font-weight: 500; letter-spacing: .02em; }
  .gate-sub { margin: 0 0 22px; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--text-3); text-transform: uppercase; }
  .gate input {
    width: 100%; padding: 13px 14px; border-radius: 9px; font-size: 16px; text-align: center;
    background: rgba(5,10,18,.7); border: 1px solid var(--border); color: var(--text);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .gate input::placeholder { color: var(--text-3); }
  .gate input:focus { border-color: var(--border-2); box-shadow: 0 0 0 3px rgba(79,209,255,.08); }
  .gate button {
    width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #04121F; font-size: 15px; font-weight: 500;
    transition: transform .12s, filter .2s;
  }
  .gate button:hover { filter: brightness(1.06); }
  .gate button:active { transform: scale(.985); }
  .gate button:disabled { opacity: .6; cursor: default; }
  .gate-err { margin: 12px 0 0; font-size: 12.5px; color: var(--danger); min-height: 17px; }
  .gate-hint { margin: 14px 0 0; font-size: 10.5px; color: var(--text-3); font-family: var(--mono); }

  .app { position: relative; z-index: 1; }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(5,10,18,.88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 9px; padding: 10px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px rgba(79,209,255,.7); }
  .brand-text { font-size: 15px; font-weight: 500; letter-spacing: .02em; }
  .brand-ver { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }

  .search-wrap { flex: 1; min-width: 0; position: relative; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-3); pointer-events: none; }
  .search {
    width: 100%; padding: 9px 12px 9px 33px; border-radius: 9px; font-size: 16px;
    background: rgba(11,21,36,.9); border: 1px solid var(--border); color: var(--text);
    outline: none; transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--text-3); font-size: 13px; }
  .search:focus { border-color: var(--border-2); box-shadow: 0 0 0 3px rgba(79,209,255,.07); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; }

  .filter-btn {
    position: relative; flex-shrink: 0; width: 38px; height: 38px; border-radius: 9px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; transition: border-color .2s, color .2s;
  }
  .filter-btn:hover { border-color: var(--border-2); color: var(--accent); }
  .filter-btn svg { width: 17px; height: 17px; }
  .filter-btn .dot {
    position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent); opacity: 0; transition: opacity .2s;
  }
  .filter-btn.on .dot { opacity: 1; }
  .filter-btn.on { border-color: var(--border-2); color: var(--accent); }

  .active-bar { max-width: 1100px; margin: 0 auto; padding: 0 16px 10px; display: none; gap: 7px; flex-wrap: wrap; align-items: center; }
  .active-bar.on { display: flex; }
  .active-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-radius: 7px;
    background: var(--accent-soft); border: 1px solid rgba(79,209,255,.26); color: #9FE3FF; font-size: 12px;
  }
  .active-chip button { background: none; border: none; color: inherit; cursor: pointer; opacity: .7; font-size: 13px; line-height: 1; padding: 0; }
  .active-chip button:hover { opacity: 1; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .stats { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0 12px; font-size: 12px; color: var(--text-3); }
  .stats b { color: var(--text-2); font-weight: 500; }
  .stats .right { margin-left: auto; display: flex; align-items: center; gap: 7px; font-family: var(--mono); }
  .pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding-bottom: 64px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; display: flex; flex-direction: column; gap: 9px; min-width: 0;
    padding: 14px; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(180deg, rgba(16,29,49,.72), rgba(11,21,36,.92));
    border: 1px solid var(--border);
    animation: rise .3s ease both; animation-delay: calc(var(--i, 0) * 16ms);
    transition: border-color .2s, transform .2s, background .2s;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, var(--accent), rgba(79,209,255,0));
    transform: scaleX(.14); transform-origin: left; opacity: .8;
    transition: transform .38s cubic-bezier(.22,.9,.28,1), opacity .3s;
  }
  .card::after {
    content: ''; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px;
    border-top: 1px solid rgba(79,209,255,.3); border-right: 1px solid rgba(79,209,255,.3);
    transition: border-color .2s;
  }
  .card:hover { border-color: var(--border-2); background: linear-gradient(180deg, rgba(20,36,58,.85), rgba(11,21,36,.95)); }
  .card:hover::before { transform: scaleX(1); }
  .card:hover::after { border-color: rgba(79,209,255,.7); }
  .card:active { transform: scale(.995); }

  .card-top { display: flex; gap: 10px; align-items: flex-start; min-width: 0; padding-right: 22px; }
  .fav {
    position: relative; width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; overflow: hidden;
    background: var(--accent-soft); border: 1px solid rgba(79,209,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--accent);
  }
  .fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: rgba(255,255,255,.05); }
  .card-titles { min-width: 0; flex: 1; }
  .card-title {
    font-size: 14px; font-weight: 500; line-height: 1.4; color: #E4EEFB; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-host { margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--accent); opacity: .78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-desc {
    margin: 0; font-size: 12.5px; color: var(--text-2); line-height: 1.6; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-foot { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
  .chip-cat {
    font-size: 10.5px; padding: 2px 7px; border-radius: 5px; color: #9FE3FF;
    background: var(--accent-soft); border: 1px solid rgba(79,209,255,.26); white-space: nowrap;
  }
  .chip-tag { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; color: var(--text-2); background: rgba(90,170,255,.07); border: 1px solid rgba(90,170,255,.12); white-space: nowrap; }
  .card-date { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .card-hit { position: absolute; inset: 0; width: 100%; height: 100%; background: none; border: none; padding: 0; cursor: pointer; z-index: 1; border-radius: inherit; }
  .card-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card-jump {
    position: absolute; right: 9px; bottom: 9px; z-index: 2;
    width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--accent); background: rgba(79,209,255,.10); border: 1px solid rgba(79,209,255,.3);
    font-size: 13px; line-height: 1; transition: background .18s, border-color .18s, transform .12s;
  }
  .card-jump:hover { background: rgba(79,209,255,.22); border-color: rgba(79,209,255,.6); }
  .card-jump:active { transform: scale(.92); }

  .empty { text-align: center; padding: 70px 20px; color: var(--text-3); }
  .empty h3 { margin: 0 0 6px; font-size: 14px; font-weight: 500; color: var(--text-2); }
  .empty p { margin: 0; font-size: 12.5px; }

  .overlay {
    position: fixed; inset: 0; z-index: 40; background: rgba(2,5,10,.66);
    opacity: 0; pointer-events: none; transition: opacity .28s;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
    width: min(87vw, 344px); display: flex; flex-direction: column;
    background: var(--bg-2); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .3s cubic-bezier(.22,.9,.28,1);
    box-shadow: 24px 0 60px rgba(0,0,0,.5);
  }
  .drawer.on { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 12px 16px; border-bottom: 1px solid var(--border); }
  .drawer-head .t { font-size: 14px; font-weight: 500; letter-spacing: .04em; }
  .drawer-head .t span { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); margin-left: 6px; letter-spacing: .14em; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; background: none; border: 1px solid transparent; color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; transition: color .2s, border-color .2s, background .2s; }
  .icon-btn:hover { color: var(--accent); border-color: var(--border); background: rgba(79,209,255,.06); }
  .drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0 14px; }
  .sec { padding: 12px 0 4px; }
  .sec-title { padding: 0 16px 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--text-3); text-transform: uppercase; }
  .row {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 16px; border: none; background: none;
    color: var(--text-2); font-size: 13px; text-align: left; cursor: pointer; transition: color .18s, background .18s;
  }
  .row:hover { color: var(--text); background: rgba(79,209,255,.05); }
  .row.is-active { color: var(--accent); background: rgba(79,209,255,.09); }
  .row .n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .row.is-active .n { color: rgba(79,209,255,.75); }
  .row .caret { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-3); transition: transform .2s; display: flex; align-items: center; justify-content: center; font-size: 9px; }
  .row .caret.open { transform: rotate(90deg); }
  .row .caret.blank { opacity: 0; }
  .row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.sub { padding-left: 38px; font-size: 12.5px; }
  .row.top-level { color: var(--text); }
  .tag-search {
    display: block; width: calc(100% - 32px); margin: 0 16px 10px; padding: 7px 10px; border-radius: 7px;
    background: rgba(5,10,18,.6); border: 1px solid var(--border); color: var(--text); font-size: 16px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .tag-search::placeholder { color: var(--text-3); font-size: 12px; }
  .tag-search:focus { border-color: var(--border-2); }
  .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px; }
  .tag-pill {
    padding: 4px 9px; border-radius: 6px; font-size: 11.5px; cursor: pointer;
    background: rgba(90,170,255,.07); border: 1px solid rgba(90,170,255,.13); color: var(--text-2);
    transition: color .18s, border-color .18s, background .18s;
  }
  .tag-pill:hover { color: var(--text); border-color: var(--border-2); }
  .tag-pill.is-active { background: var(--accent-soft); border-color: rgba(79,209,255,.45); color: var(--accent); }
  .tag-pill .n { font-family: var(--mono); font-size: 10px; opacity: .6; margin-left: 3px; }
  .link-btn { display: block; margin: 10px 16px 0; padding: 6px 0; background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; text-align: left; }
  .link-btn:hover { text-decoration: underline; }
  .drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: rgba(5,10,18,.6); }
  .drawer-foot .c { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .ghost-btn {
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12px;
    background: none; border: 1px solid var(--border); color: var(--text-2); transition: color .2s, border-color .2s;
  }
  .ghost-btn:hover { color: var(--accent); border-color: var(--border-2); }

  .detail {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    background: var(--bg); opacity: 0; pointer-events: none; transform: translateY(14px);
    transition: opacity .22s ease, transform .26s cubic-bezier(.22,.9,.28,1);
  }
  .detail.on { opacity: 1; pointer-events: auto; transform: none; }
  .detail-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: rgba(5,10,18,.9); }
  .detail-bar .t { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--text-3); text-transform: uppercase; }
  .detail-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .detail-body { max-width: 720px; margin: 0 auto; padding: 22px 20px 28px; }
  .d-hero { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 22px; }
  .d-fav {
    position: relative; width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0; overflow: hidden;
    background: var(--accent-soft); border: 1px solid rgba(79,209,255,.28);
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; color: var(--accent);
  }
  .d-fav img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: rgba(255,255,255,.05); }
  .d-h1 { margin: 2px 0 5px; font-size: 19px; font-weight: 500; line-height: 1.4; color: #EAF2FD; word-break: break-word; }
  .d-host { font-family: var(--mono); font-size: 12px; color: var(--accent); opacity: .85; }
  .d-sec { margin-bottom: 20px; }
  .d-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--text-3); text-transform: uppercase; margin-bottom: 7px; }
  .d-text { margin: 0; font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .d-text.muted { color: var(--text-3); font-size: 13px; }
  .d-url {
    display: block; padding: 10px 12px; border-radius: 8px; font-family: var(--mono); font-size: 12px;
    background: rgba(11,21,36,.8); border: 1px solid var(--border); color: #A9D6F2;
    word-break: break-all; line-height: 1.6; transition: border-color .2s;
  }
  .d-url:hover { border-color: var(--border-2); }
  .d-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .d-tag { padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; background: rgba(90,170,255,.07); border: 1px solid rgba(90,170,255,.14); color: var(--text-2); transition: color .18s, border-color .18s; }
  .d-tag:hover { color: var(--accent); border-color: rgba(79,209,255,.45); }
  .d-meta { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 10.5px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .detail-actions {
    display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: rgba(5,10,18,.95);
  }
  .primary-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px; border-radius: 9px; background: var(--accent); color: #04121F;
    font-size: 14px; font-weight: 500; transition: filter .2s, transform .12s;
  }
  .primary-btn:hover { filter: brightness(1.07); }
  .primary-btn:active { transform: scale(.99); }
  .detail-actions .ghost-btn { height: 44px; padding: 0 16px; font-size: 13px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
    z-index: 90; padding: 9px 16px; border-radius: 8px; font-size: 12.5px;
    background: rgba(16,29,49,.97); border: 1px solid var(--border-2); color: var(--text);
    opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); white-space: nowrap;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark"></div>
    <h1>欧阳的收藏夹</h1>
    <p class="gate-sub">Private Bookmark Vault</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="pwd" placeholder="请输入访问密码" autocomplete="current-password" />
      <button type="submit" id="btn-unlock">校验并解密</button>
    </form>
    <p class="gate-err" id="gate-err"></p>
    <p class="gate-hint" id="gate-hint">AES-256-GCM · 本地解密</p>
  </div>
</div>

<div class="app hidden" id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-text">欧阳的收藏夹</span>
        <span class="brand-ver" id="brand-ver">v2.0.0</span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input class="search" id="search" type="search" placeholder="搜索标题、网址、描述、标签…" />
      </div>
      <button class="filter-btn" id="btn-drawer" aria-label="打开筛选抽屉">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
    </div>
    <div class="active-bar" id="active-bar"></div>
  </header>

  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="t">筛选 <span>FILTER</span></div>
    <button class="icon-btn" id="btn-drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="sec">
      <div class="sec-title">分类</div>
      <div id="cat-list"></div>
    </div>
    <div class="sec">
      <div class="sec-title">标签</div>
      <input class="tag-search" id="tag-search" placeholder="筛选标签…" />
      <div class="tag-wrap" id="tag-list"></div>
      <button class="link-btn" id="btn-more-tags">展开全部</button>
    </div>
  </div>
  <div class="drawer-foot">
    <span class="c" id="drawer-count">—</span>
    <button class="ghost-btn" id="btn-clear">清除筛选</button>
  </div>
</aside>

<section class="detail" id="detail" aria-hidden="true">
  <div class="detail-bar">
    <button class="icon-btn" id="btn-back" aria-label="返回">←</button>
    <span class="t">Bookmark Detail</span>
  </div>
  <div class="detail-scroll"><div class="detail-body" id="detail-body"></div></div>
  <div class="detail-actions">
    <a class="primary-btn" id="btn-open" target="_blank" rel="noopener noreferrer">打开网站 ↗</a>
    <button class="ghost-btn" id="btn-copy">复制链接</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var VERSION = '2.0.0';
  var LS_KEY = 'ouyang-pwd';

  var $ = function (id) { return document.getElementById(id); };
  var bookmarks = [], categories = [], catMap = {}, byId = {}, updatedAt = '';
  var catCounts = {}, groupIds = {}, groupOrder = [], tagCounts = [];
  var cat = 'all', tag = null, kw = '', tagQ = '', showAllTags = false;
  var expanded = {};
  var openedFromList = false, currentId = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function b64ToBytes(b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u || ''; } }
  function letterOf(u) { var h = hostOf(u); return (h.charAt(0) || '?').toUpperCase(); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(ts) { if (!ts) return ''; var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtDateTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function shortCat(name) { return name ? String(name).split('/').pop() : ''; }
  function groupOf(name) { return name ? String(name).split('/')[0] : ''; }
  function catName(id) { var c = catMap[id]; return c ? c.name : ''; }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }

  function decryptData(password, enc) {
    var enc2 = new TextEncoder();
    return crypto.subtle.importKey('raw', enc2.encode(password), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(enc.salt), iterations: 100000, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ct));
      })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function tryUnlock(pwd) {
    var btn = $('btn-unlock'), err = $('gate-err');
    if (!pwd) { err.textContent = '请输入密码'; return; }
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '解密中…';
    fetch('data/encrypted.json?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (enc) { return decryptData(pwd, enc); })
      .then(function (data) {
        bookmarks = (data.bookmarks || []).filter(function (b) { return !b.isDeleted; });
        categories = data.categories || [];
        updatedAt = data.updatedAt || '';
        buildIndex();
        try { localStorage.setItem(LS_KEY, pwd); } catch (e) {}
        $('gate').classList.add('hidden');
        $('app').classList.remove('hidden');
        $('brand-ver').textContent = 'v' + VERSION;
        buildDrawer();
        renderList();
        route(true);
        btn.disabled = false;
        btn.textContent = '校验并解密';
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = '校验并解密';
        err.textContent = '密码错误或数据加载失败';
        $('gate-hint').textContent = String((e && e.message) || e).slice(0, 64);
      });
  }

  function buildIndex() {
    byId = {}; catMap = {}; catCounts = {}; groupIds = {}; groupOrder = []; expanded = {};
    categories.forEach(function (c) { catMap[c.id] = c; });

    var tagTmp = {};
    bookmarks.forEach(function (b) {
      byId[b.id] = b;
      var key = b.categoryId || 'none';
      catCounts[key] = (catCounts[key] || 0) + 1;
      (b.tags || []).forEach(function (t) { tagTmp[t] = (tagTmp[t] || 0) + 1; });
    });

    tagCounts = Object.keys(tagTmp).map(function (t) { return { name: t, n: tagTmp[t] }; })
      .sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name); });

    categories.forEach(function (c) {
      if (!catCounts[c.id]) return;
      var g = groupOf(c.name);
      if (!groupIds[g]) { groupIds[g] = { total: 0, ids: {}, children: [], leaf: false }; groupOrder.push(g); expanded[g] = true; }
      groupIds[g].ids[c.id] = 1;
      groupIds[g].children.push(c);
      groupIds[g].total += catCounts[c.id];
    });
    groupOrder.sort(function (a, b) { return groupIds[b].total - groupIds[a].total; });
    groupOrder.forEach(function (g) {
      var node = groupIds[g];
      node.children.sort(function (a, b) { return catCounts[b.id] - catCounts[a.id]; });
      node.leaf = (node.children.length === 1 && node.children[0].name === g);
    });
  }

  function inCat(b) {
    if (cat === 'all') return true;
    if (cat === 'none') return !b.categoryId;
    if (cat.indexOf('c:') === 0) return b.categoryId === cat.slice(2);
    if (cat.indexOf('g:') === 0) {
      var g = groupIds[cat.slice(2)];
      return !!g && !!b.categoryId && !!g.ids[b.categoryId];
    }
    return true;
  }
  function filtered() {
    var list = bookmarks.filter(inCat);
    if (tag) list = list.filter(function (b) { return (b.tags || []).indexOf(tag) >= 0; });
    if (kw) {
      var k = kw.toLowerCase();
      list = list.filter(function (b) {
        return (b.title || '').toLowerCase().indexOf(k) >= 0
          || (b.url || '').toLowerCase().indexOf(k) >= 0
          || (b.description || '').toLowerCase().indexOf(k) >= 0
          || (b.tags || []).some(function (t) { return String(t).toLowerCase().indexOf(k) >= 0; });
      });
    }
    return list.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }

  function renderList() {
    var list = filtered();
    renderActiveBar();
    renderStats(list.length);
    renderGrid(list);
    syncDrawer();
    $('btn-drawer').classList.toggle('on', (cat !== 'all') || !!tag || !!kw);
  }

  function renderActiveBar() {
    var bar = $('active-bar'), out = [];
    if (cat === 'none') out.push({ k: 'cat', t: '未分类' });
    else if (cat.indexOf('c:') === 0) out.push({ k: 'cat', t: shortCat(catName(cat.slice(2))) });
    else if (cat.indexOf('g:') === 0) out.push({ k: 'cat', t: cat.slice(2) });
    if (tag) out.push({ k: 'tag', t: '#' + tag });
    if (kw) out.push({ k: 'kw', t: '“' + kw + '”' });
    bar.classList.toggle('on', out.length > 0);
    bar.innerHTML = out.map(function (o) {
      return '<span class="active-chip">' + esc(o.t) + '<button data-clear="' + o.k + '" aria-label="移除">✕</button></span>';
    }).join('');
  }

  function renderStats(n) {
    var right = '';
    if (updatedAt) {
      var d = new Date(updatedAt);
      right = '<span class="pulse"></span><span>' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</span>';
    }
    $('stats').innerHTML = '<span>显示 <b>' + n + '</b> / 共 <b>' + bookmarks.length + '</b> 条</span>' +
      '<span class="right">' + right + '</span>';
  }

  function favHtml(url, cls) {
    var letter = esc(letterOf(url));
    var img = url ? '<img src="' + esc(url) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()" />' : '';
    return '<div class="' + cls + '">' + img + letter + '</div>';
  }

  function renderGrid(list) {
    var grid = $('grid');
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><h3>没有匹配的书签</h3><p>换个关键词，或清除筛选条件</p></div>';
      return;
    }
    grid.innerHTML = list.map(function (b, i) {
      var name = catName(b.categoryId);
      var tags = (b.tags || []).slice(0, 3).map(function (t) {
        return '<span class="chip-tag">#' + esc(t) + '</span>';
      }).join('');
      var delay = ' style="--i:' + (i < 40 ? i : 0) + '"';
      return '<article class="card"' + delay + ' data-id="' + esc(b.id) + '">' +
        '<div class="card-top">' + favHtml(b.favicon, 'fav') +
          '<div class="card-titles"><div class="card-title">' + esc(b.title || b.url || '(无标题)') + '</div>' +
          '<div class="card-host">' + esc(hostOf(b.url)) + '</div></div>' +
        '</div>' +
        (b.description ? '<p class="card-desc">' + esc(b.description) + '</p>' : '') +
        '<div class="card-foot">' +
          (name ? '<span class="chip-cat">' + esc(shortCat(name)) + '</span>' : '') + tags +
          '<span class="card-date">' + fmtDate(b.updatedAt) + '</span>' +
        '</div>' +
        '<button class="card-hit" data-open="' + esc(b.id) + '" aria-label="查看明细"></button>' +
        '<a class="card-jump" href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer" aria-label="直接打开网站">↗</a>' +
      '</article>';
    }).join('');
  }

  function buildDrawer() {
    var html = '<button class="row top-level" data-cat="all"><span class="caret blank"></span><span class="label">全部</span><span class="n">' + bookmarks.length + '</span></button>' +
      '<button class="row top-level" data-cat="none"><span class="caret blank"></span><span class="label">未分类</span><span class="n">' + (catCounts['none'] || 0) + '</span></button>';
    groupOrder.forEach(function (g) {
      var node = groupIds[g];
      html += '<button class="row top-level" data-cat="g:' + esc(g) + '">' +
        (node.leaf ? '<span class="caret blank"></span>' : '<span class="caret' + (expanded[g] ? ' open' : '') + '" data-toggle="' + esc(g) + '">▶</span>') +
        '<span class="label">' + esc(g) + '</span><span class="n">' + node.total + '</span></button>';
      if (!node.leaf && expanded[g]) {
        node.children.forEach(function (c) {
          html += '<button class="row sub" data-cat="c:' + esc(c.id) + '"><span class="label">' + esc(shortCat(c.name)) + '</span><span class="n">' + (catCounts[c.id] || 0) + '</span></button>';
        });
      }
    });
    $('cat-list').innerHTML = html;
    buildTags();
  }

  function buildTags() {
    var q = tagQ.toLowerCase();
    var list = tagCounts.filter(function (t) { return !q || t.name.toLowerCase().indexOf(q) >= 0; });
    var limit = (showAllTags || q) ? list.length : Math.min(30, list.length);
    var html = list.slice(0, limit).map(function (t) {
      return '<button class="tag-pill" data-tag="' + esc(t.name) + '">' + esc(t.name) + '<span class="n">' + t.n + '</span></button>';
    }).join('');
    if (!html) html = '<span style="font-size:12px;color:var(--text-3);padding:2px 0;">没有匹配的标签</span>';
    $('tag-list').innerHTML = html;
    var more = $('btn-more-tags');
    if (q) { more.style.display = 'none'; }
    else {
      more.style.display = 'block';
      more.textContent = showAllTags ? '收起' : '展开全部（' + tagCounts.length + '）';
    }
    syncDrawer();
  }

  function syncDrawer() {
    var nodes = $('cat-list').querySelectorAll('[data-cat]');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.toggle('is-active', nodes[i].getAttribute('data-cat') === cat);
    var pills = $('tag-list').querySelectorAll('[data-tag]');
    for (var j = 0; j < pills.length; j++) pills[j].classList.toggle('is-active', pills[j].getAttribute('data-tag') === tag);
    $('drawer-count').textContent = filtered().length + ' 条结果';
  }

  function openDrawer() {
    $('drawer').classList.add('on');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('overlay').classList.add('on');
    document.documentElement.classList.add('lock');
  }
  function closeDrawer() {
    $('drawer').classList.remove('on');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('overlay').classList.remove('on');
    if (!$('detail').classList.contains('on')) document.documentElement.classList.remove('lock');
  }

  function renderDetail(b) {
    var name = catName(b.categoryId);
    var tags = (b.tags || []).map(function (t) {
      return '<button class="d-tag" data-dtag="' + esc(t) + '">#' + esc(t) + '</button>';
    }).join('');
    $('detail-body').innerHTML =
      '<div class="d-hero">' + favHtml(b.favicon, 'd-fav') +
        '<div><h1 class="d-h1">' + esc(b.title || '(无标题)') + '</h1>' +
        '<div class="d-host">' + esc(hostOf(b.url)) + '</div></div>' +
      '</div>' +
      '<div class="d-sec"><div class="d-label">描述</div>' +
        (b.description ? '<p class="d-text">' + esc(b.description) + '</p>' : '<p class="d-text muted">这条书签没有描述</p>') +
      '</div>' +
      '<div class="d-sec"><div class="d-label">网址</div>' +
        '<a class="d-url" href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer">' + esc(b.url) + '</a>' +
      '</div>' +
      (name ? '<div class="d-sec"><div class="d-label">分类</div><div class="d-tags"><button class="d-tag" data-dcat="' + esc(b.categoryId) + '">' + esc(name) + '</button></div></div>' : '') +
      (tags ? '<div class="d-sec"><div class="d-label">标签</div><div class="d-tags">' + tags + '</div></div>' : '') +
      '<div class="d-meta"><span>创建 ' + fmtDateTime(b.createdAt) + '</span><span>更新 ' + fmtDateTime(b.updatedAt) + '</span></div>';
    $('btn-open').href = b.url;
  }

  function openDetail(id) {
    var b = byId[id];
    if (!b) return;
    currentId = id;
    renderDetail(b);
    $('detail').classList.add('on');
    $('detail').setAttribute('aria-hidden', 'false');
    $('detail').querySelector('.detail-scroll').scrollTop = 0;
    document.documentElement.classList.add('lock');
  }
  function closeDetail() {
    currentId = null;
    $('detail').classList.remove('on');
    $('detail').setAttribute('aria-hidden', 'true');
    if (!$('drawer').classList.contains('on')) document.documentElement.classList.remove('lock');
  }

  function route(initial) {
    var m = location.hash.match(/^#\/b\/(.+)$/);
    var id = m ? decodeURIComponent(m[1]) : null;
    if (id && byId[id]) {
      if (currentId !== id) openDetail(id);
    } else if (currentId) {
      closeDetail();
    }
    if (!initial) openedFromList = false;
  }

  $('gate-form').addEventListener('submit', function (e) {
    e.preventDefault();
    tryUnlock($('pwd').value);
  });

  $('btn-drawer').addEventListener('click', openDrawer);
  $('btn-drawer-close').addEventListener('click', closeDrawer);
  $('overlay').addEventListener('click', closeDrawer);

  $('cat-list').addEventListener('click', function (e) {
    var toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      var g = toggle.getAttribute('data-toggle');
      expanded[g] = !expanded[g];
      buildDrawer();
      return;
    }
    var row = e.target.closest('[data-cat]');
    if (!row) return;
    cat = row.getAttribute('data-cat');
    renderList();
  });

  $('tag-list').addEventListener('click', function (e) {
    var pill = e.target.closest('[data-tag]');
    if (!pill) return;
    var t = pill.getAttribute('data-tag');
    tag = (tag === t) ? null : t;
    renderList();
  });

  var tagTimer;
  $('tag-search').addEventListener('input', function (e) {
    clearTimeout(tagTimer);
    var v = e.target.value.trim();
    tagTimer = setTimeout(function () { tagQ = v; buildTags(); }, 120);
  });

  $('btn-more-tags').addEventListener('click', function () {
    showAllTags = !showAllTags;
    buildTags();
  });

  $('btn-clear').addEventListener('click', function () {
    cat = 'all'; tag = null; kw = ''; tagQ = '';
    $('search').value = '';
    $('tag-search').value = '';
    renderList();
    buildTags();
    closeDrawer();
  });

  $('active-bar').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-clear]');
    if (!btn) return;
    var k = btn.getAttribute('data-clear');
    if (k === 'cat') cat = 'all';
    if (k === 'tag') tag = null;
    if (k === 'kw') { kw = ''; $('search').value = ''; }
    renderList();
  });

  $('grid').addEventListener('click', function (e) {
    if (e.target.closest('.card-jump')) return;
    var hit = e.target.closest('[data-open]');
    var card = e.target.closest('.card');
    var id = hit ? hit.getAttribute('data-open') : (card ? card.getAttribute('data-id') : null);
    if (!id) return;
    openedFromList = true;
    location.hash = '#/b/' + encodeURIComponent(id);
  });

  $('btn-back').addEventListener('click', function () {
    if (openedFromList && history.length > 1) history.back();
    else location.hash = '';
  });

  $('detail-body').addEventListener('click', function (e) {
    var dtag = e.target.closest('[data-dtag]');
    if (dtag) {
      tag = dtag.getAttribute('data-dtag');
      cat = 'all';
      location.hash = '';
      renderList();
      return;
    }
    var dcat = e.target.closest('[data-dcat]');
    if (dcat) {
      cat = 'c:' + dcat.getAttribute('data-dcat');
      tag = null;
      location.hash = '';
      renderList();
    }
  });

  $('btn-copy').addEventListener('click', function () {
    var b = byId[currentId];
    if (!b) return;
    var url = b.url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('链接已复制'); }, function () { fallbackCopy(url); });
    } else {
      fallbackCopy(url);
    }
  });
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('链接已复制'); } catch (e) { toast('复制失败，请长按网址'); }
    document.body.removeChild(ta);
  }

  var searchTimer;
  $('search').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    var v = e.target.value.trim();
    searchTimer = setTimeout(function () { kw = v; renderList(); }, 120);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('drawer').classList.contains('on')) { closeDrawer(); return; }
      if ($('detail').classList.contains('on')) { $('btn-back').click(); return; }
    }
    if (e.key === '/' && !$('app').classList.contains('hidden') && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      $('search').focus();
    }
  });

  window.addEventListener('hashchange', function () { route(false); });

  if (!window.crypto || !window.crypto.subtle) {
    $('gate-hint').textContent = '需通过 HTTPS 访问才能解密';
  }
  var saved = null;
  try { saved = localStorage.getItem(LS_KEY); } catch (e) {}
  if (saved) {
    $('pwd').value = saved;
    tryUnlock(saved);
  } else {
    setTimeout(function () { $('pwd').focus(); }, 200);
  }
})();
</script>
</body>
