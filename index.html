<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>欧阳的收藏夹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b5672a'/%3E%3Cpath d='M18 22h12l4 5h12a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V25a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f7f6f3; --surface: #fff; --surface-2: #f1efe9;
    --border: #e5e2da; --text: #23211b; --text-2: #6b675c; --text-3: #9a958a;
    --accent: #b5672a; --accent-soft: #f4e6d8; --tag-bg: #ecebe6;
    --danger: #b3402f; --radius: 10px;
    --shadow: 0 1px 2px rgba(35,33,27,.04), 0 4px 16px rgba(35,33,27,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .gate { max-width: 400px; margin: 100px auto; padding: 0 20px; text-align: center; }
  .gate h2 { margin: 0 0 6px; font-size: 20px; }
  .gate p { color: var(--text-3); font-size: 13px; margin: 0 0 20px; }
  .gate input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 16px; text-align: center;
    background: var(--surface); color: var(--text); outline: none;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate button {
    width: 100%; margin-top: 10px; padding: 12px; border: none;
    border-radius: 8px; background: var(--text); color: #fff;
    font-size: 15px; cursor: pointer; font-weight: 500;
  }
  .gate .err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247,246,243,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 10px 16px;
  }
  .topbar-row { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand-dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); display: inline-block; }
  .search-wrap { flex: 1; min-width: 0; position: relative; }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-3); pointer-events: none;
  }
  .search {
    width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); font-size: 16px;
    color: var(--text); outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .toolbar { max-width: 1100px; margin: 12px auto 0; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    padding: 6px 12px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-2); font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.active { background: var(--text); color: #fff; border-color: var(--text); }
  .chip .count { color: var(--text-3); font-size: 11px; }
  .chip.active .count { color: rgba(255,255,255,.7); }

  .tag-cloud { max-width: 1100px; margin: 8px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 3px 10px; border-radius: 999px; background: var(--tag-bg); color: var(--text-2); font-size: 12px; cursor: pointer; }
  .tag.active { background: var(--accent); color: #fff; }

  .stats { max-width: 1100px; margin: 10px auto 0; padding: 0 16px; color: var(--text-3); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .stats .updated { margin-left: auto; }

  .grid { max-width: 1100px; margin: 14px auto 60px; padding: 0 16px; display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    transition: box-shadow .15s; min-width: 0;
  }
  .card:hover { box-shadow: var(--shadow); }
  .card-head { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .favicon {
    width: 32px; height: 32px; border-radius: 7px; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .card-title {
    font-weight: 600; font-size: 14.5px; line-height: 1.4; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-url {
    font-size: 12px; color: var(--text-3); word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-desc {
    font-size: 13px; color: var(--text-2); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: auto; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); }
  .badge.cat { background: var(--accent-soft); color: var(--accent); }
  .date { font-size: 11px; color: var(--text-3); margin-left: auto; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>欧阳的收藏夹</h2>
  <p>请输入访问密码</p>
  <input type="password" id="pwd" placeholder="密码" autocomplete="off" />
  <button id="btn-unlock">进入</button>
  <div class="err" id="gate-err">密码错误，请重试</div>
</div>

<div id="main" class="hidden">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="brand-dot"></span>欧阳的收藏夹</div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="search" type="search" placeholder="搜索标题、网址、标签…" />
      </div>
    </div>
  </div>
  <div class="toolbar" id="category-bar"></div>
  <div class="tag-cloud" id="tag-cloud"></div>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let bookmarks = [], categories = [], activeCategory = 'all', activeTag = null, keyword = '', updatedAt = '';

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decryptData(password, enc) {
    const enc2 = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc2.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(enc.salt), iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ct)
    );
    return JSON.parse(new TextDecoder().decode(plaintext));
  }

  async function tryUnlock() {
    const pwd = $('pwd').value;
    if (!pwd) return;
    $('gate-err').style.display = 'none';
    try {
      const res = await fetch('data/encrypted.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const enc = await res.json();
      const data = await decryptData(pwd, enc);
      bookmarks = (data.bookmarks || []).filter(b => !b.isDeleted);
      categories = data.categories || [];
      updatedAt = data.updatedAt || new Date().toISOString();
      localStorage.setItem('ouyang-pwd', pwd);
      $('gate').classList.add('hidden');
      $('main').classList.remove('hidden');
      renderAll();
    } catch (e) {
      $('gate-err').style.display = 'block';
    }
  }

  $('btn-unlock').addEventListener('click', tryUnlock);
  $('pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

  const saved = localStorage.getItem('ouyang-pwd');
  if (saved) { $('pwd').value = saved; tryUnlock(); }

  function catName(id) {
    if (!id) return null;
    const c = categories.find(x => x.id === id);
    return c ? c.name : null;
  }
  function renderAll() { renderCategoryBar(); renderTagCloud(); renderStats(); renderGrid(); }

  function renderCategoryBar() {
    const bar = $('category-bar');
    const counts = { all: bookmarks.length };
    for (const b of bookmarks) { const cid = b.categoryId || 'none'; counts[cid] = (counts[cid] || 0) + 1; }
    let html = '<span class="chip ' + (activeCategory==='all'?'active':'') + '" data-cat="all">全部 <span class="count">' + counts.all + '</span></span>';
    html += '<span class="chip ' + (activeCategory==='none'?'active':'') + '" data-cat="none">未分类 <span class="count">' + (counts.none||0) + '</span></span>';
    for (const c of categories) {
      if (!counts[c.id]) continue;
      html += '<span class="chip ' + (activeCategory===c.id?'active':'') + '" data-cat="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + ' <span class="count">' + counts[c.id] + '</span></span>';
    }
    bar.innerHTML = html;
    bar.querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => { activeCategory = el.dataset.cat; renderAll(); });
    });
  }

  function renderTagCloud() {
    const cloud = $('tag-cloud');
    const counts = {};
    for (const b of filteredBookmarks()) { for (const t of (b.tags || [])) counts[t] = (counts[t] || 0) + 1; }
    const tags = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 30);
    cloud.innerHTML = tags.map(([t, n]) =>
      '<span class="tag ' + (activeTag===t?'active':'') + '" data-tag="' + escapeHtml(t) + '">#' + escapeHtml(t) + ' <span style="opacity:.6">' + n + '</span></span>'
    ).join('');
    cloud.querySelectorAll('.tag').forEach(el => {
      el.addEventListener('click', () => { activeTag = (activeTag === el.dataset.tag) ? null : el.dataset.tag; renderAll(); });
    });
  }

  function filteredBookmarks() {
    let list = bookmarks;
    if (activeCategory === 'all') {}
    else if (activeCategory === 'none') list = list.filter(b => !b.categoryId);
    else list = list.filter(b => b.categoryId === activeCategory);
    if (activeTag) list = list.filter(b => (b.tags || []).includes(activeTag));
    if (keyword) {
      const k = keyword.toLowerCase();
      list = list.filter(b =>
        (b.title || '').toLowerCase().includes(k) ||
        (b.url || '').toLowerCase().includes(k) ||
        (b.description || '').toLowerCase().includes(k) ||
        (b.tags || []).some(t => t.toLowerCase().includes(k))
      );
    }
    return list;
  }

  function renderStats() {
    const list = filteredBookmarks();
    let html = '<span>显示 ' + list.length + ' / 共 ' + bookmarks.length + ' 条</span>';
    if (activeTag) html += '<span id="clear-tag" style="cursor:pointer;color:var(--accent);">已过滤 #' + escapeHtml(activeTag) + ' ✕</span>';
    if (updatedAt) {
      const d = new Date(updatedAt);
      const pad = n => String(n).padStart(2,'0');
      html += '<span class="updated">更新于 ' + d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</span>';
    }
    $('stats').innerHTML = html;
    const ct = $('clear-tag');
    if (ct) ct.addEventListener('click', () => { activeTag = null; renderAll(); });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./,''); } catch { return url || ''; } }
  function letterOf(url) { const h = hostOf(url); return (h[0] || '?').toUpperCase(); }
  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function renderGrid() {
    const list = filteredBookmarks();
    if (!list.length) {
      $('content').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-3);"><h3 style="color:var(--text-2);margin:0 0 6px;">没有匹配的书签</h3><p>试试换个关键词，或清除筛选。</p></div>';
      return;
    }
    list.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    $('content').innerHTML = '<div class="grid">' + list.map(b => {
      const title = b.title || b.url || '(无标题)';
      const desc = b.description || '';
      const cname = catName(b.categoryId);
      const tagsHtml = (b.tags || []).slice(0, 4).map(t => '<span class="badge">#' + escapeHtml(t) + '</span>').join('');
      return '<a class="card" href="' + escapeHtml(b.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="card-head"><div class="favicon">' + escapeHtml(letterOf(b.url)) + '</div>' +
        '<div style="min-width:0;flex:1;"><div class="card-title">' + escapeHtml(title) + '</div>' +
        '<div class="card-url">' + escapeHtml(hostOf(b.url)) + '</div></div></div>' +
        (desc ? '<div class="card-desc">' + escapeHtml(desc) + '</div>' : '') +
        '<div class="card-meta">' + (cname ? '<span class="badge cat">' + escapeHtml(cname) + '</span>' : '') + tagsHtml +
        '<span class="date">' + fmtDate(b.updatedAt) + '</span></div></a>';
    }).join('') + '</div>';
  }

  let searchTimer;
  $('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { keyword = e.target.value.trim(); renderAll(); }, 120);
  });
})();
</script>
</body>
</html>
